[package]
name = "qualitycheck"
version = "0.1.0"
edition = "2024"
description = "Quantifiable, configurable code quality evaluation using TypeSafe AI Jev"
license = "MIT"
authors = ["Pedro Rojas <166954170+NomekoGenkah@users.noreply.github.com>"]
repository = "https://github.com/NomekoGenkah/qualitycheck"
homepage = "https://github.com/NomekoGenkah/qualitycheck"
readme = "README.md"
keywords = ["code-quality", "linter", "ai", "cli", "jev"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "qualitycheck"
path = "src/lib.rs"

[[bin]]
name = "qualitycheck"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.0"
directories = "6.0.0"
git2 = "0.21.0"
globset = "0.4.20"
ignore = "0.4.33"
is-terminal = "0.4.17"
jsonschema = "0.56.0"
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
